<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhamento VIVOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: lista de clientes e, dentro de cada cliente, tres abas (Visao geral, Publicacoes e Extras). Paleta creme e bronze, fonte Plus Jakarta Sans. */
:root{
  --bg:#F6F0E6; --surface:#FFFBF5; --ink:#2B2118; --muted:#7A6A58; --line:#E6DACA;
  --bronze:#9C7A52; --bronze-ink:#FFFBF5; --bronze-soft:#EFE3D0; --good:#4F7A4A;
  --shadow:0 1px 2px rgba(60,40,15,.06),0 8px 24px rgba(60,40,15,.06);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1710; --surface:#271F16; --ink:#F1E8DA; --muted:#A8977F; --line:#3A2F22;
  --bronze:#C09A6B; --bronze-ink:#1D1710; --bronze-soft:#3A2E20; --good:#8DB587;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1710; --surface:#271F16; --ink:#F1E8DA; --muted:#A8977F; --line:#3A2F22;
  --bronze:#C09A6B; --bronze-ink:#1D1710; --bronze-soft:#3A2E20; --good:#8DB587;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font);margin:0;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.btn{background:var(--bronze);color:var(--bronze-ink);border:0;border-radius:12px;padding:10px 18px;font-weight:700;font-size:14px}
.btn.ghost{background:transparent;color:var(--bronze);border:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"],.chip.on{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink)}
.tag{display:inline-block;background:var(--bronze-soft);color:var(--bronze);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.dot{width:30px;height:30px;border-radius:10px;background:var(--bronze);display:grid;place-items:center;color:var(--bronze-ink);font-size:14px;font-weight:800}
.note{font-size:12.5px;color:var(--muted);background:var(--bronze-soft);border-radius:12px;padding:8px 12px}

/* lista de clientes */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.client{text-align:left;padding:20px;display:flex;flex-direction:column;gap:14px;border-radius:20px;transition:transform .15s,border-color .15s}
.client:hover{transform:translateY(-2px);border-color:var(--bronze)}
.avatar{width:48px;height:48px;border-radius:14px;background:var(--bronze-soft);color:var(--bronze);display:grid;place-items:center;font-weight:800;font-size:17px}
.client h3{font-size:17px;font-weight:700}
.client .meta{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* cliente */
.head{padding:0;overflow:hidden}
.hrow{padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.head h1{font-size:20px}
.head .grow{min-width:140px}
.banner{position:relative;width:100%;height:clamp(150px,21vw,260px);background:var(--bronze-soft);overflow:hidden}
.bov{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:28px 16px 12px;background:linear-gradient(transparent,rgba(20,14,8,.7))}
.bov h1{font-size:18px;color:#F6F0E6;margin:0}
.bov .avatar{width:30px;height:30px;font-size:12px;border-radius:9px;background:rgba(246,240,230,.92);color:#2B2118}
.ovl{position:absolute;top:10px;right:12px;background:rgba(20,14,8,.45);color:#F6F0E6;border:0;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.ovl:hover{background:rgba(20,14,8,.7)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.hp{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-top:8px}
.hp img{width:100%;max-height:120px;object-fit:cover;border-radius:10px;display:block}
.head .grow{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.back{background:none;border:0;color:var(--bronze);font-weight:700;padding:0;text-align:left;width:fit-content}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;background:var(--bg)}
.nav a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.nav a:hover{color:var(--bronze);border-color:var(--bronze)}
section{display:flex;flex-direction:column;gap:16px;scroll-margin-top:64px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sh p{color:var(--muted);font-size:14px;margin-top:2px}

/* metricas */
.ch{padding:20px;display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}
.ch-name{display:flex;flex-direction:column;gap:6px}
.ch-name h3{font-size:16px;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px}
.num{display:flex;flex-direction:column;gap:2px;min-width:0}
.num b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num span{font-size:12.5px;color:var(--muted)}
.num em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--good)}
.spark{display:block;width:100%;height:28px;margin-top:4px}

/* antes e depois */
.ba{padding:20px;display:flex;flex-direction:column;gap:16px}
.cmp{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/8;border:1px solid var(--line);user-select:none;background:var(--bronze-soft)}
.pane{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;gap:12px}
.pane.after{background:linear-gradient(135deg,#EFE3D0,#D9C3A2);color:#2B2118}
.pane.before{background:#E9E4DC;color:#6b6258;clip-path:inset(0 50% 0 0)}
:root[data-theme="dark"] .pane.before,:root:not([data-theme="light"]) .pane.before{}
.tagpane{position:absolute;top:14px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:rgba(43,33,24,.82);color:#F6F0E6;border-radius:999px;padding:5px 12px}
.before .tagpane{left:14px}.after .tagpane{right:14px}
.fake{margin-top:30px;display:flex;flex-direction:column;gap:8px;max-width:340px}
.fake i{display:block;height:10px;border-radius:6px;background:currentColor;opacity:.22}
.fake .ph{height:64px;border-radius:12px;opacity:.16}
.fake .row{display:flex;gap:8px}.fake .row i{flex:1}
.handle{position:absolute;top:0;bottom:0;width:3px;background:var(--bronze);left:50%;transform:translateX(-50%);pointer-events:none}
.handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;border-radius:50%;background:var(--bronze);transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.range{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cap div{display:flex;flex-direction:column;gap:4px;font-size:14px}

/* portfolio */
.pick{padding:20px;display:flex;flex-direction:column;gap:10px}
input[type=search]{font:500 16px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 16px;width:100%}
.rows{display:flex;flex-direction:column;max-height:420px;overflow-y:auto;margin-top:6px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 6px}
.row:hover{background:var(--bronze-soft)}
.rn{display:flex;flex-direction:column;flex:1;min-width:0}
.rn small{color:var(--muted);font-size:12.5px}
.go{color:var(--bronze);font-weight:700;font-size:13px}
.avatar.sm{width:38px;height:38px;border-radius:11px;font-size:14px}
.pubc{padding:20px;display:flex;flex-direction:column;gap:16px}
.sum{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.leg{margin-left:auto;display:flex;gap:16px;font-size:13px;color:var(--muted)}
.leg span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.sw.a{background:var(--bronze)}.sw.b{background:var(--bronze-soft);border:1.5px dashed var(--bronze)}
.chartbox svg{display:block;width:100%;height:auto}
.mrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 28px}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mrow b{width:76px;font-weight:700}
.mp{color:var(--muted);font-size:13px;flex:1}
.mt{font-weight:700;font-size:13px;margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.step button{width:28px;height:28px;border-radius:50%;border:0;background:var(--bronze);color:var(--bronze-ink);font-weight:800;font-size:16px;line-height:1}
.step .ev{min-width:26px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;padding:6px 8px}
.pt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
.pt th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pt td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pt tr:last-child td{border-bottom:0}
.lk{color:var(--bronze);font-weight:700;text-decoration:none}
.lk:hover{text-decoration:underline}
.tag.off{background:transparent;border:1px solid var(--line);color:var(--muted)}
.lk2{background:none;border:0;padding:0;color:var(--bronze);font-weight:700;text-decoration:underline}
.fsel{display:flex;gap:8px;flex-wrap:wrap}
.fsel select{font-size:13px;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:999px;background:transparent}
#fbac,#pano,#pmes,#fano,#fmes,#ftipo,#troca{font:600 12.5px var(--font);padding:3px 8px;border-radius:999px;color:var(--muted);background:transparent}
#pano,#pmes{font-size:14px;padding:6px 12px;color:var(--ink)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cnt{position:absolute;top:10px;left:10px;font-style:normal;font-size:11px;font-weight:700;background:rgba(43,33,24,.78);color:#F6F0E6;border-radius:999px;padding:3px 9px}
.lbc{max-height:86vh;overflow-y:auto}
.strip{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px 0}
.st{width:56px;height:56px;flex:none;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:none}
.st.on{border-color:var(--bronze)}
.st img{width:100%;height:100%;object-fit:cover;display:block}
.addb{display:flex;flex-direction:column;gap:14px;padding:0 20px 16px}
.fl{display:flex;flex-direction:column;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.addb input[type=text],.addb input[type=date]{font:500 15px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
.prev{display:flex;gap:8px;flex-wrap:wrap}
.pv{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pv button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(43,33,24,.8);color:#F6F0E6;font-size:13px;line-height:1;padding:0}
.addb textarea{font:500 15px/1.5 var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.chk input{accent-color:var(--bronze);width:16px;height:16px}
.td{font-size:12.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dd{white-space:pre-line;margin-top:2px}
.btn.sm{padding:7px 14px;font-size:13px}
.lb.conf{z-index:30}
.cfc{max-width:420px}
.btn.warn{background:var(--ink);color:var(--bg)}
.rmlink{background:none;border:0;padding:2px 0;font-size:12px;color:var(--muted);opacity:.75;text-decoration:underline;text-underline-offset:3px}
.rmlink:hover{opacity:1;color:var(--ink)}
.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb video.lbv{object-fit:contain;background:#000;z-index:1}
.lbc .thumb{align-items:flex-start}
.lbc .thumb span{z-index:2}
.pl{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(43,33,24,.7)}
.pl::before{content:"";position:absolute;left:17px;top:12px;border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent #F6F0E6}
.st{position:relative}
.st video,.pv video{width:100%;height:100%;object-fit:cover;display:block}
.st .pl,.pv .pl{transform:scale(.55)}
.cap2,.capt{position:absolute;left:3px;bottom:3px;font-style:normal;font-size:10px;font-weight:800;background:var(--bronze);color:var(--bronze-ink);border-radius:999px;padding:1px 7px}
.pv{cursor:pointer}
.pv.cv{outline:2px solid var(--bronze);outline-offset:1px}
.hint{flex-basis:100%;font-size:12px;color:var(--muted);margin:0}
.rmrow{display:flex;gap:16px;flex-wrap:wrap}
.st.ov{border-color:var(--bronze);opacity:.6}
.st[draggable=true],.pv[draggable=true]{cursor:grab}
.bagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.bacard{padding:16px;display:flex;flex-direction:column;gap:12px}
.bah{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bap{color:var(--muted);font-size:13px}
.bah .rmlink{margin-left:auto}
.bpair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bs{display:flex;flex-direction:column;gap:6px;min-width:0}
.bl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bimg{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--bronze-soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.bimg img{width:100%;height:100%;object-fit:cover;display:block}
.bph{color:var(--muted);font-size:13px}
.bhd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bdt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bc{font-size:13px;margin:0}
.fsv{position:fixed;inset:0;z-index:40;background:rgba(14,10,6,.95);display:flex;align-items:center;justify-content:center;gap:8px;padding:56px 12px 24px}
.fsf{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:calc(100% - 120px);min-width:0}
.fsf img{max-width:100%;max-height:calc(100vh - 170px);object-fit:contain;border-radius:8px;display:block}
.fsf figcaption{color:#F1E8DA;text-align:center;font-size:13px}
.fsf figcaption b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-right:6px}
.fsf figcaption span{color:#BBA98F}
.fsf figcaption p{margin:6px 0 0}
.fsa{flex:none;width:56px;height:96px;background:none;border:0;color:rgba(255,255,255,.5);font-size:64px;line-height:1;cursor:pointer;padding:0}
.fsa:hover{color:#fff}
.fsa.off{visibility:hidden}
.fsx{position:absolute;top:10px;right:14px;background:none;border:0;color:rgba(255,255,255,.6);font-size:36px;line-height:1;cursor:pointer;padding:4px 8px}
.fsx:hover{color:#fff}
button.bimg{padding:0;width:100%;cursor:zoom-in}
@media(max-width:640px){.fsa{width:40px;font-size:48px}.fsf{max-width:calc(100% - 88px)}}
.tabb{white-space:nowrap;font-weight:700;font-size:13px;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.tabb:hover{color:var(--bronze);border-color:var(--bronze)}
.tabb.on{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink)}
.tilew{position:relative;display:flex;flex-direction:column}
.tilew .tile{flex:1;width:100%}
.tilex{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(43,33,24,.55);color:#F6F0E6;font-size:15px;line-height:1;padding:0;opacity:0;transition:opacity .15s;cursor:pointer;z-index:2}
.tilew:hover .tilex,.tilex:focus-visible{opacity:1}
@media(hover:none){.tilex{opacity:.75}}
.dtrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addb .dtrow input[type=text]{width:130px}
.btn.soft{background:transparent;color:var(--bronze);border:1px solid var(--bronze);padding:6px 14px;font-size:13px;font-weight:600}
.btn.plus{width:34px;height:34px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.btn.plus svg{display:block}
.btn.soft:hover{background:var(--bronze-soft)}
.adj{width:100%;aspect-ratio:3.2/1;min-height:100px;border-radius:10px;overflow:hidden;background:var(--bronze-soft);cursor:grab;touch-action:none;position:relative}
.adj img{width:100%;height:100%;max-height:none;border-radius:0;object-fit:cover;display:block;user-select:none;pointer-events:none}
.zm{display:flex;align-items:center;gap:10px;width:100%}
.zm input{flex:1;accent-color:var(--bronze)}
.hh{width:72px;height:36px;border-radius:8px;overflow:hidden;padding:0;border:1px solid var(--line);background:var(--bronze-soft);cursor:pointer}
.hh img{width:100%;height:100%;object-fit:cover;display:block}
.hh:hover{border-color:var(--bronze)}
.fl.bad{outline:2px solid var(--bronze);outline-offset:6px;border-radius:8px}
.tck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);background:rgba(43,33,24,.35);pointer-events:none;z-index:2}
.tck.on{background:var(--bronze);border-color:var(--bronze)}
.tck.on::after{content:"";position:absolute;left:6.5px;top:3px;width:5px;height:10px;border:solid var(--bronze-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.tilew.on .tile{border-color:var(--bronze);box-shadow:0 0 0 2px var(--bronze)}
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.btn.soft:disabled{opacity:.4;cursor:default}
.vfail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#F1E8DA;background:#1d1710;font-size:13px;z-index:1}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn{cursor:pointer;display:inline-block}
.sel{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{font:600 14px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.filters{display:flex;gap:18px;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:8px}
.fg .chips{gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tile{text-align:left;padding:0;overflow:hidden;border-radius:18px;display:flex;flex-direction:column}
.thumb{aspect-ratio:1/1;position:relative;display:flex;align-items:flex-end;padding:10px;color:#2B2118;overflow:hidden}
.thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,rgba(255,255,255,.45),transparent 55%)}
.thumb span{position:relative;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:rgba(246,240,230,.85);border-radius:999px;padding:4px 10px}
.tile:hover{border-color:var(--bronze)}
.tinfo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.tinfo b{font-size:14px;font-weight:700}
.tinfo small{color:var(--muted);font-size:12.5px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(20,14,8,.82);z-index:20;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.lbc{background:var(--surface);border-radius:20px;max-width:560px;width:100%;overflow:hidden;display:flex;flex-direction:column}
.lbc .thumb{aspect-ratio:1/1}
.lbi{padding:16px 20px 20px;display:flex;flex-direction:column;gap:6px}
.lbn{display:flex;gap:8px;padding:0 20px 20px}
@media(max-width:640px){.ch{grid-template-columns:1fr}.cap{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- refinamento para desktop: mais limpo e proporcional ---- */
:root{--shadow:0 1px 2px rgba(60,40,15,.04),0 6px 22px rgba(60,40,15,.05)}
.wrap{max-width:1120px;gap:32px}
h2{font-size:20px;font-weight:700}
.card{border-radius:18px}
.sh{align-items:center}
.nav.tabs{gap:0;border-bottom:1px solid var(--line);padding:0;margin-bottom:-8px}
.tabb{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:12px 4px;margin-right:28px;margin-bottom:-1px;font-size:14px;color:var(--muted)}
.tabb:hover{color:var(--ink);border-color:var(--line)}
.tabb.on{background:none;color:var(--ink);border-bottom-color:var(--bronze)}
.banner{height:clamp(140px,15vw,200px)}
.bov{padding:36px 22px 16px}
.bov h1{font-size:20px}
.hrow{padding:14px 20px}
.wrap>.pick,.wrap>.note{max-width:720px;width:100%;align-self:center}
.pubc{padding:22px 24px}
.bacard{padding:18px;gap:14px}
.bpair{gap:16px}
.tinfo b{font-size:13.5px}
@media(min-width:900px){
  .pubc{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(230px,1fr);gap:6px 36px;align-items:start}
  .pubc .sum{grid-column:1;grid-row:1}
  .pubc .chartbox{grid-column:1;grid-row:2}
  .pubc .mrows{grid-column:2;grid-row:1/3;display:block;border-left:1px solid var(--line);padding-left:28px}
  .pubc .mrow{padding:5px 0;font-size:13px}
  .pubc{grid-template-rows:auto 1fr}
  .pubc .chartbox{align-self:center}
  .pubc .mrows{align-self:start}
  .pubc .mrow:first-child{border-top:0}
  .bimg{aspect-ratio:4/3}
  .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
}
.sh-end{justify-content:flex-end}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media(max-width:640px){.btn.plus{width:28px;height:28px}.btn.plus svg{width:13px;height:13px}}

             {canal:'Facebook',itens:[['Seguidores','2.130','+1,2%',[6,6,7,7,7,8,8]],['Alcance','6.900','+4%',[5,5,6,6,7,7,8]]]},
             {canal:'Google Meu Negócio',itens:[['Visualizações do perfil','3.480','+22%',[3,4,5,6,7,8,9]],['Ligações','126','+15%',[4,4,5,6,6,8,8]],['Rotas solicitadas','94','+9%',[4,5,5,6,7,7,8]]]} ],
      '90':[ {canal:'Instagram',itens:[['Seguidores','4.820','+9,4%',[3,4,5,6,7,8,9]],['Alcance','58.900','+31%',[2,3,5,5,7,8,9]],['Interações','5.210','+24%',[2,4,4,6,7,8,9]]]},
             {canal:'Facebook',itens:[['Seguidores','2.130','+3,6%',[5,6,6,7,7,8,8]],['Alcance','19.400','+11%',[4,5,5,6,7,8,8]]]},

           ['Google Meu Negócio','Fotos do perfil','Out/2026','Google Meu Negócio'],['Arte','Datas comemorativas','Out/2026','Arte'],['Vídeo','Bastidores da equipe','Set/2026','Vídeo'],
           ['Identidade visual','Padrão visual do feed','Set/2026','Identidade visual'],['Carrossel','Perguntas frequentes','Set/2026','Carrossel'],['Google Meu Negócio','Postagens semanais','Set/2026','Google Meu Negócio'] ]
  },
  { id:'cliente-b', nome:'Cliente Exemplo B', seg:'Advogado', ini:'CB', canais:['Instagram','Google Meu Negócio'], atual:'Atualizado em 30/10/2026', metricas:null, ba:[], port:[] },
  { id:'cliente-c', nome:'Cliente Exemplo C', seg:'Hospital', ini:'CC', canais:['Instagram','Facebook'], atual:'Atualizado em 22/10/2026', metricas:null, ba:[], port:[] }
];
const SEGS=['Médico','Médico veterinário','Advogado','Hospital'], CAN=[['Instagram'],['Instagram','Facebook'],['Instagram','Google Meu Negócio'],['Instagram','Facebook','Google Meu Negócio']];
for(let n=4;n<=20;n++){const l=String(n).padStart(2,'0');CLIENTS.push({id:'cliente-'+l,nome:'Cliente Exemplo '+l,seg:SEGS[n%4],ini:'C'+l.slice(-1),canais:CAN[n%4],atual:'Atualizado em '+(10+n)+'/10/2026',metricas:null,ba:[],port:[]})}
const TIPOS=['Post','Carrossel','Reel','Vídeo'];
(function(){const cfg=[['2025-07',12],['2025-08',14],['2025-09',13],['2025-10',15],['2025-11',12],['2025-12',14],['2026-06',12],['2026-07',15],['2026-08',12],['2026-09',13],['2026-10',16],['2026-11',14]],out=[];let sd=7;
  const rnd=()=>{sd=(sd*9301+49297)%233280;return sd/233280};
  cfg.forEach(([ym,n])=>{for(let i=0;i<n;i++){const day=Math.min(28,1+Math.floor(i*28/n)),t=TIPOS[(i+ +ym.slice(5))%4],
    base=t==='Reel'?6000:t==='Vídeo'?4200:t==='Carrossel'?3500:2100,al=Math.round(base*(.8+rnd()*.5));
    out.push([t,ym+'-'+String(day).padStart(2,'0'),'https://www.instagram.com/p/EXEMPLO'+(out.length+1)+'/',al,Math.round(al*.025),Math.round(al*(t==='Reel'||t==='Vídeo'?1.9:1.35)),Math.round(al*.11),Math.round(al*.009),Math.round(al*(t==='Carrossel'?.06:.02))])}});
  CLIENTS[0].posts=out;CLIENTS[0].pub.semanal=3})();
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const $ = s => document.querySelector(s);
const app = $('#app');
let state = { per:'30', baIdx:0, fPer:'Todos', fTipo:'Todos', lb:null };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function spark(v,w=120,h=28){
  const max=Math.max(...v),min=Math.min(...v),sx=w/(v.length-1);
  const pts=v.map((y,i)=>[i*sx,h-3-((y-min)/(max-min||1))*(h-8)]);
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--bronze)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]-2}" cy="${last[1]}" r="3" fill="var(--bronze)"/></svg>`;
}

function list(){
  app.innerHTML = `
  <div class="top"><div class="brand"><div class="dot">V</div>VIVOX Flow</div><span class="label">Protótipo com dados de exemplo</span></div>
  <div class="card pick">
    <label class="label" for="busca">Buscar cliente</label>
    <input id="busca" type="search" placeholder="Digite o nome do cliente" autocomplete="off">
    <div class="rows" id="clist"></div>
  </div>
  <p class="note">Pedido para a próxima etapa: conectar esta lista ao cadastro de clientes da plataforma que vocês já usam, para puxar as informações automaticamente. Ainda não está feito. Os clientes acima são exemplos.</p>`;
  const draw=()=>{
    const f=norm($('#busca').value.trim());
    const r=CLIENTS.filter(c=>norm(c.nome+' '+c.seg).includes(f));
    $('#clist').innerHTML=r.length?r.map(c=>`<button class="row" data-id="${c.id}"><span class="avatar sm">${c.ini}</span><span class="rn"><b>${esc(c.nome)}</b><small>${c.seg}</small></span><span class="go">Abrir →</span></button>`).join(''):'<div class="empty">Nenhum cliente encontrado.</div>';
    $('#clist').querySelectorAll('.row').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id});
  };
  $('#busca').oninput=draw;
  $('#busca').onkeydown=e=>{if(e.key==='Enter'){const b=$('#clist .row');if(b)b.click()}};
  draw(); $('#busca').focus();
}

function detail(c){
  const per = state.per, ports = c.port;
  const anos=[...new Set(ports.flatMap(p=>cobre(p).map(x=>x[0])))].sort((x,y)=>y-x);
  const fA=state.fAno||'Todos', fM=state.fMes||'Todos';
  const shown=ports.map((p,i)=>({p,i})).filter(({p})=>cobre(p).some(x=>(fA==='Todos'||x[0]==fA)&&(fM==='Todos'||x[1]==fM))).sort((x,y)=>((y.p.anoIni*12+y.p.mesIni)-(x.p.anoIni*12+x.p.mesIni))||(y.i-x.i));
  app.innerHTML = `
  <div class="top"><div class="brand"><div class="dot">V</div>VIVOX Flow</div><span class="label">Protótipo com dados de exemplo</span></div>
  <div class="top"><button class="back" id="back">← Todos os clientes</button>
    <select id="troca" aria-label="Trocar de cliente">${CLIENTS.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div>
  <div class="card head">
    ${c.hdrFoto?`<div class="banner"><img src="${c.hdrFoto.u}" alt="" style="${fotoStyle(c.hdrFoto)}"><div class="bov"><h1>${esc(c.nome)}</h1></div><button class="ovl" id="edhead">Editar cabeçalho</button></div>`
    :`<div class="hrow"><div class="avatar" style="width:44px;height:44px;font-size:16px;border-radius:12px">${c.ini}</div>
      <div class="grow"><h1>${esc(c.nome)}</h1></div>
      <button class="rmlink" id="edhead">Editar cabeçalho</button></div>`}
  </div>
  ${c.metricas?`
  <nav class="nav tabs" role="tablist" aria-label="Abas do cliente">${[['geral','Visão geral'],['pub','Publicações'],['extras','Extras']].map(([k,l])=>{const on=(state.tab||'geral')===k;return `<button role="tab" class="tabb ${on?'on':''}" aria-selected="${on}" data-tab="${k}">${l}</button>`}).join('')}</nav>

  ${state.tab==='pub'?`<section id="s-pub">${pubHTML(c)}</section>

  <section id="s-posts">${postsHTML(c)}</section>`:''}

  ${state.tab!=='pub'&&state.tab!=='extras'?`<section id="s-antes">${baHTML(c)}</section>`:''}

  ${state.tab==='extras'?`<section id="s-port">
    <div class="sh"><div><h2>Extras</h2></div><div class="sel">${ports.length?`<button class="btn soft" id="selbtn">${state.selMode?'Concluir':'Selecionar'}</button>`:''}<button class="btn soft plus" id="addbtn" aria-label="Adicionar extra" title="Adicionar extra"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg></button></div></div>
    ${state.selMode?`<div class="selbar"><span>${(state.sel||[]).length} selecionado${(state.sel||[]).length===1?'':'s'}</span><button class="btn soft" id="selEdit" ${(state.sel||[]).length===1?'':'disabled'}>Editar</button><button class="btn soft" id="selDel" ${(state.sel||[]).length?'':'disabled'}>Apagar</button></div>`:''}
    ${ports.length?`<div class="fsel">
      <select id="fano" aria-label="Ano"><option value="Todos">Todos os anos</option>${anos.map(x=>`<option value="${x}" ${String(x)===String(fA)?'selected':''}>${x}</option>`).join('')}</select>
      <select id="fmes" aria-label="Mês"><option value="Todos">Todos os meses</option>${FULL.map((m,i)=>`<option value="${i+1}" ${String(i+1)===String(fM)?'selected':''}>${m}</option>`).join('')}</select>

    </div>`:''}
    ${shown.length?`<div class="grid">${shown.map(({p,i})=>`
      <div class="tilew ${(state.sel||[]).includes(i)?'on':''}"><button class="card tile" data-lb="${i}">${thumbHTML(p,i)}
        <div class="tinfo"><b>${esc(p.titulo)}</b><small>${periodo(p)}</small>${p.desc&&p.showDesc!==false?`<p class="td">${esc(p.desc)}</p>`:''}</div></button>${state.selMode?`<span class="tck ${(state.sel||[]).includes(i)?'on':''}" aria-hidden="true"></span>`:''}</div>`).join('')}</div>`
      :`<div class="card empty">${ports.length?'Nenhum extra neste filtro.':'Nenhum extra ainda. Use o botão + para começar.'}</div>`}
  </section>`:''}`:`
  <div class="card empty">Este cliente ainda não tem dados cadastrados neste protótipo. Abra a Clínica Exemplo para ver a página completa.</div>`}
  ${state.lb!==null?lightbox(c):''}
  ${state.confirm&&state.lb!==null?confirmHTML(c):''}
  ${state.baConfirm!=null?baConfirmHTML():''}
  ${state.tConfirm!=null?tConfirmHTML(c):''}
  ${state.baView?baViewHTML(c):''}`;
  bind(c);
}

const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const mkey=l=>{const q=l.split('/');return +q[1]*12+MES.indexOf(q[0])};
const mesDe=d=>MES[+d.slice(5,7)-1]+'/'+d.slice(0,4), dataBR=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4), nf=n=>n.toLocaleString('pt-BR');
function mesesPub(c,ano){
  const p=c.pub, prev={}; p.meses.forEach(r=>prev[r[0]]=r[1]);
  const cnt={}; (c.posts||[]).forEach(x=>{const l=mesDe(x[1]);cnt[l]=(cnt[l]||0)+1});
  const def=Math.round(p.semanal*52/12);
  return MES.map(m=>{const l=m+'/'+ano,pk=prev[l]??def,n=cnt[l]||0;return [l,pk,Math.min(n,pk),Math.max(0,n-pk),n]});
}
function pubHTML(c){
  const p=c.pub; if(!p) return '';
  const anos=[...new Set([...(c.posts||[]).map(x=>+x[1].slice(0,4)),...p.meses.map(r=>+r[0].split('/')[1])])].sort((x,y)=>y-x);
  const ano=anos.includes(+state.pAno)?+state.pAno:anos[0];
  const m=mesesPub(c,ano), n=m.length, top=Math.ceil((Math.max(...m.map(r=>r[4]))+1)/4)*4;
  const W=640,H=220,L=30,B=28,Tp=24,step=(W-L-6)/n,bw=step*.46,y=v=>H-B-(v/top)*(H-B-Tp);
  let g='';
  for(let t=0;t<=top;t+=top/4){g+=`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`}
  m.forEach((r,i)=>{
    const x=L+i*step+(step-bw)/2,yt=y(r[4]);
    if(r[4]>0) g+=`<rect x="${x}" y="${yt}" width="${bw}" height="${H-B-yt}" rx="6" fill="var(--bronze)"/>`;
    if(r[4]>0) g+=`<text x="${x+bw/2}" y="${yt-7}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">${r[4]}</text>`;
    g+=`<text x="${x+bw/2}" y="${H-9}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${r[0].slice(0,3)}</text>`;
  });
  const somaTot=m.reduce((a,r)=>a+r[4],0);
  return `<div class="sh"><div><h2>Publicações por mês</h2><p>Contratado: ${p.pacote}. O total de cada mês vem da lista de publicações abaixo.</p></div>
    <select id="pano" aria-label="Ano">${anos.map(x=>`<option value="${x}" ${x===ano?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="card pubc">
    <div class="sum"><div class="num"><span>Total em ${ano}</span><b>${somaTot}</b></div></div>
    <div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Publicações por mês">${g}</svg></div>
    <div class="mrows">${m.map(r=>`<div class="mrow"><b>${r[0].slice(0,3)}</b><span class="mt">${r[4]} publicadas</span></div>`).join('')}</div>
  </div>`;
}
function postsHTML(c){
  const all=c.posts; if(!all) return '';
  const meses=[...new Set(all.map(p=>mesDe(p[1])))].sort((x,y)=>mkey(y)-mkey(x));
  const sel=state.pMes&&(state.pMes==='Todos'||meses.includes(state.pMes))?state.pMes:meses[0];
  const rows=all.filter(p=>sel==='Todos'||mesDe(p[1])===sel).sort((a,b)=>b[1].localeCompare(a[1]));
  return `<div class="sh"><div><h2>Lista de publicações</h2><p>Cada publicação com tipo, data, link e resultados. Ao adicionar, ela entra na contagem do mês.</p></div>
    <div class="sel"><select id="pmes" aria-label="Mês">${['Todos',...meses].map(m=>`<option value="${m}" ${m===sel?'selected':''}>${m==='Todos'?'Todos os meses':m}</option>`).join('')}</select>
    <label class="btn soft" id="csvbtn" for="csvfile">Enviar CSV</label><input type="file" id="csvfile" accept=".csv,text/csv" class="vh"></div></div>
  ${state.pMsg?`<p class="note" role="status">${state.pMsg}</p>`:''}
  <div class="card tw"><table class="pt"><thead><tr><th>Data</th><th>Tipo</th><th>Link</th><th>Alcance</th><th>Envios</th><th>Visualizações</th><th>Curtidas</th><th>Comentários</th><th>Salvamentos</th></tr></thead>
  <tbody>${rows.map(p=>`<tr><td>${dataBR(p[1])}</td><td><span class="tag">${p[0]}</span></td><td><a class="lk" href="${esc(p[2])}" target="_blank" rel="noopener">Abrir no Instagram ↗</a></td><td>${nf(p[3])}</td><td>${nf(p[4])}</td><td>${nf(p[5])}</td><td>${nf(p[6])}</td><td>${nf(p[7])}</td><td>${nf(p[8])}</td></tr>`).join('')}</tbody></table></div>
  <p class="note">Colunas do CSV: tipo, data, link, alcance, envios, visualizacoes, curtidas, comentarios, salvamentos. Tipo aceita Post, Carrossel, Reel ou Vídeo. Data aceita 2026-11-05 ou 05/11/2026. <button class="lk2" id="csvcopy">Copiar modelo</button></p>
  <p class="note">Links e números do protótipo são de exemplo.</p>`;
}
function parseCSV(t){
  t=t.replace(/^﻿/,''); const f1=t.split(/\r?\n/)[0], d=(f1.match(/;/g)||[]).length>(f1.match(/,/g)||[]).length?';':',';
  const rows=[]; let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true; else if(ch===d){r.push(f);f=''}

function importCSV(c,text){

  const cols=['tipo','data','link','alcance','envios','visualizacoes','curtidas','comentarios','salvamentos'], pos=cols.map(ix);
  const falta=cols.filter((k,i)=>pos[i]<0);
  if(falta.length) return 'Faltam colunas no cabeçalho: '+falta.join(', ')+'.';
  const tipo=v=>{v=norm(v);return v.includes('carross')?'Carrossel':v.includes('reel')?'Reel':v.includes('video')?'Vídeo':/post|foto|imagem/.test(v)?'Post':null};

  const num=v=>parseInt(String(v).replace(/[^\d]/g,''),10)||0;

  rows.slice(1).forEach(r=>{
    const t=tipo(r[pos[0]]||''),d=dt(r[pos[1]]||''),l=(r[pos[2]]||'').trim();
    if(!t||!d||!l){bad++;return}
    if(links.has(l)){dup++;return}
    links.add(l); c.posts.push([t,d,l,num(r[pos[3]]),num(r[pos[4]]),num(r[pos[5]]),num(r[pos[6]]),num(r[pos[7]]),num(r[pos[8]])]); add++;
    if(d>last) last=d;
